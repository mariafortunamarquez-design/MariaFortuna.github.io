  <script src="./script.js" defer></script>
</head>

<body>
  <canvas id="background" aria-hidden="true"></canvas>

  <button
    class="theme-button"
    id="themeToggle"
    type="button"
    aria-label="Cambiar entre modo claro y oscuro"

  <main class="card">
    <img
      class="avatar"
      src="./1792447235157.jpg"
      alt="Foto de María Fortuna"
      width="116"
      height="116"
      onerror="this.style.display='none'"
    >

    <h1>María Fortuna</h1>

    <p class="role">
      Desarrollo de software · Bases de Datos · Unity
    </p>

    <p class="role">
      Orientación a objetos · Web · Godot
    </p>

    <div class="links">
      <a
        class="link linkedin"
        href="https://www.linkedin.com/in/mar%C3%ADa-fortuna-rodr%C3%ADguez-m%C3%A1rquez-822167445/"
        target="_blank"
        rel="noopener noreferrer"
      >
        LinkedIn
      </a>

      <a
        class="link github"
        href="https://github.com/mariafortunamarquez-design"
        target="_blank"
        rel="noopener noreferrer"
      >
        GitHub
      </a>

      <div class="contact-wrap">
        <button
          class="contact-button"
          id="contactButton"
          type="button"
          aria-controls="contactMenu"
        >
          Contacto
        </button>

        <div class="contact-menu" id="contactMenu">
          <a href="mailto:mariafortunamarquez@gmail.com">
            Email
          </a>

          <a href="tel:+34684080986">
            Teléfono
          </a>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
