<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>María Fortuna — Software Developer</title>

  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>

<body>
  <canvas id="background" aria-hidden="true"></canvas>

  <button
    class="theme-button"
    id="themeToggle"
    type="button"
    aria-label="Cambiar entre modo claro y oscuro"
  >
    <span id="themeIcon" aria-hidden="true">🌙</span>
    <span id="themeText">Modo oscuro</span>
  </button>

  <main class="card">
    <img
      class="avatar"
      src="./1792447235157.jpg"
      alt="Foto de María Fortuna"
      width="116"
      height="116"
      onerror="this.style.display='none'"
    >

    <h1>María Fortuna</h1>

    <p class="role">
      Desarrollo de software · Bases de Datos · Unity
    </p>

    <p class="role">
      Orientación a objetos · Web · Godot
    </p>

    <div class="links">
      <a
        class="link linkedin"
        href="https://www.linkedin.com/in/mar%C3%ADa-fortuna-rodr%C3%ADguez-m%C3%A1rquez-822167445/"
        target="_blank"
        rel="noopener noreferrer"
      >
        LinkedIn
      </a>

      <a
        class="link github"
        href="https://github.com/mariafortunamarquez-design"
        target="_blank"
        rel="noopener noreferrer"
      >
        GitHub
      </a>

      <div class="contact-wrap">
        <button
          class="contact-button"
          id="contactButton"
          type="button"
          aria-controls="contactMenu"
          aria-expanded="false"
        >
          Contacto
        </button>

        <div class="contact-menu" id="contactMenu">
          <div class="contact-item">
            <button
              class="contact-option"
              type="button"
              aria-expanded="false"
              aria-controls="emailDetails"
            >
              Email
            </button>

            <div
              class="contact-details"
              id="emailDetails"
              hidden
            >
              <span class="contact-value">
                mariafortunamarquez@gmail.com
              </span>

              <div class="contact-actions">
                <button
                  class="copy-button"
                  type="button"
                  data-copy="mariafortunamarquez@gmail.com"
                >
                  Copiar
                </button>
              </div>
            </div>
          </div>

          <div class="contact-item">
            <button
              class="contact-option"
              type="button"
              aria-expanded="false"
              aria-controls="phoneDetails"
            >
              Teléfono
            </button>

            <div
              class="contact-details"
              id="phoneDetails"
              hidden
            >
              <span class="contact-value">
                +34 684 080 986
              </span>

              <div class="contact-actions">
                <button
                  class="copy-button"
                  type="button"
                  data-copy="+34684080986"
                >
                  Copiar
                </button>
              </div>
            </div>
          </div>

          <p
            class="copy-status"
            id="copyStatus"
            role="status"
          ></p>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
